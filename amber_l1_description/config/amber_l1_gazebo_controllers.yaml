controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

joint_state_broadcaster:
  type: joint_state_broadcaster/JointStateBroadcaster

amber_l1_arm_controller:
  type: joint_trajectory_controller/JointTrajectoryController
  joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    - joint7
  command_interfaces:
    - position
  state_interfaces:
    - position
    - velocity
  state_publish_rate: 50.0  # Hz
  action_monitor_rate: 20.0  # Hz
  allow_partial_joints_goal: false
  constraints:
    stopped_velocity_tolerance: 0.01  # rad/s
    goal_time: 0.0  # s
    # Example per-joint constraints (can be tuned later)
    # joint1: {trajectory: 0.1, goal: 0.01}
    # joint2: {trajectory: 0.1, goal: 0.01}
    # joint3: {trajectory: 0.1, goal: 0.01}
    # joint4: {trajectory: 0.1, goal: 0.01}
    # joint5: {trajectory: 0.1, goal: 0.01}
    # joint6: {trajectory: 0.1, goal: 0.01}
    # joint7: {trajectory: 0.1, goal: 0.01}

amber_l1_gripper_controller:
  type: effort_controllers/JointGroupEffortController
  joints:
    - gripper_finger_left_joint
    - gripper_finger_right_joint
  command_interfaces: # Explicitly defining, though 'effort' is default for this type
    - effort
  # state_interfaces are not typically configured for JointGroupEffortController here,
  # as it primarily commands effort. The available states are defined in the URDF's ros2_control block.
  state_publish_rate: 50.0  # Hz, for publishing controller state (e.g., measured joint efforts if applicable)
